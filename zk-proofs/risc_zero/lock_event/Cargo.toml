[workspace]
members = ["core", "methods", "host"]
resolver = "2"

[workspace.dependencies]
lock-proof-core = { path = "core" }
lock-proof-methods = { path = "methods" }

risc0-build = { version = "3.0" }
risc0-zkvm = { version = "3.0" }
risc0-steel = { git = "https://github.com/boundless-xyz/steel.git", package = "risc0-steel", rev = "b16de8946b5f81ed6de90299d16deea284af18f7" }

alloy-primitives = { version = "1.3" }
alloy-sol-types = { version = "1.3" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.39", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2.5" }
log = { version = "0.4" }
hex = { version = "0.4" }
risc0-ethereum-contracts = { path = "../../smart-contracts/lib/risc0-ethereum/contracts" }

[profile.dev]
opt-level = 3

[profile.dev.build-override]
opt-level = 3

[profile.release]
debug = 1
lto = true

[profile.release.build-override]
opt-level = 3
