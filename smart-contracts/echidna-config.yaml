workers: 1
symExec: false

testMode: assertion
prefix: echidna_
corpusDir: echidna-corpus

# testLimit: 1000000000
testLimit: 1000000
# testLimit: 10000000 # 10M
# testLimit: 100000000 # 100M

shrinkLimit: 200000
# shrinkLimit: 100000 # 100K

# seqLen: 30
# seqLen: 250

# Keep the harness constructor non-payable. A non-zero contract balance can make
# Echidna deploy the target with value, which reverts here.
balanceContract: 0
balanceAddr:     0xffffffff

deployer: "0x00000000000000000000000000000000000fffff"
sender: ["0x0000000000000000000000000000000000010000", "0x0000000000000000000000000000000000020000", "0x0000000000000000000000000000000000030000"]

filterBlacklist: true

# `contract` is passed on the CLI because Echidna 2.3.1 treats the YAML key as unused.
# Set `FOUNDRY_PROFILE=echidna` when running Echidna so Foundry emits pre-linked bytecode
# for the harness and its dependencies.
