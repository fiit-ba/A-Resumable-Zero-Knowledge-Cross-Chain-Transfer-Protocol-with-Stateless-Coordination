[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200

remappings = [
    "risc0-ethereum/=lib/risc0-ethereum/contracts/src/",
    "openzeppelin/contracts/=lib/risc0-ethereum/lib/openzeppelin-contracts/contracts/"
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
